name: Build worker.js

# Builds the self-contained worker.js bundle on every push to main and
# commits it back. This powers the "dashboard paste" deployment track
# (docs/DEPLOYMENT.md, Track D) — wrangler deploys do NOT need this artifact
# (wrangler bundles src/index.ts itself).
#
# On failure, the build log is committed to build-status/ for debugging.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install + build (log captured)
        run: |
          set -o pipefail
          {
            echo "== npm install =="
            npm install
            echo "== build =="
            node scripts/build.mjs
          } 2>&1 | tee build-output.txt

      - name: Commit worker.js on success
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f worker.js
          if git diff --cached --quiet; then
            echo "worker.js unchanged"
          else
            git commit -m "chore: rebuild worker.js bundle"
            git push
          fi

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p build-status
          cp build-output.txt "build-status/last-failure.txt"
          git add build-status/last-failure.txt
          git commit -m "ci: build failure log"
          git push
